<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="manifest" href="assets/app.manifest">
  <title>HomeGenie - YoT</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/ios/180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/ios/32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/ios/16.png">
  <link rel="mask-icon" href="assets/images/homegenie.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">

  <link rel="icon" type="image/x-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
<link rel="stylesheet" href="styles.css"></head>
<body class="mat-typography light-theme no-highlight">
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>

  <div id="splash-screen" style="display: none; position: fixed;top:0;left:0;bottom:0;right:0; background-color: white; z-index: 1000">

    <div style="height: 100%; width: 100%; text-align: center;display: flex;justify-content: center;align-items: center;">

      <div>
        <img src="./assets/images/homegenie-yot.png" width="256">
        <p class="blinking">Loading application files...</p>
      </div>

    </div>

    <script>
      const splashScreen = document.querySelector('#splash-screen');
      setTimeout(checkInstalled, 500);
      function checkInstalled() {
        if (indexedDB.databases) {
          const dbName = 'ngStorage';
          indexedDB.databases().then(r => {
            const ngd = r.find(db => db.name === dbName);
            if (!ngd) {
              splashScreen.style['display'] = '';
              setTimeout(checkInstalled, 500);
            } else {
              splashScreen.style['display'] = 'none';
            }
          });
        } else {
          splashScreen.style['display'] = 'none';
        }
      }
    </script>

  </div>

<script src="runtime.js" type="module"></script><script src="polyfills.js" type="module"></script><script src="scripts.js" defer></script><script src="vendor.js" type="module"></script><script src="main.js" type="module"></script></body>
</html>
