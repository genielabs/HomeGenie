<section @set="void 0" class="control-card climate-card">
  <div class="card-heading"><span class="material-symbols-outlined" aria-hidden="true">thermostat</span><span #climate_heading></span></div>
  <h2 #climate_name></h2>
  <div class="climate-values">
    <div><p class="small-label" #temperature_label></p><div class="measurement"><strong #temperature></strong><span class="unit" #temperature_unit></span></div></div>
    <div><p class="small-label" #humidity_label></p><div class="measurement"><strong #humidity></strong><span class="unit" #humidity_unit></span></div></div>
  </div>
</section>
