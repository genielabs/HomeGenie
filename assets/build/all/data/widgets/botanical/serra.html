      <figcaption><span class="caption-index" aria-hidden="true">01</span><span #caption></span></figcaption>

    <aside class="readings">
      <section class="observation">
        <header><span class="section-index" aria-hidden="true">01 /</span><h2 #climate_heading></h2></header>
        <p class="source" #sensor_name></p>
        <dl class="measurements">
          <div><dt #temperature_label></dt><dd><span #temperature></span><small #temperature_unit></small></dd></div>
          <div><dt #humidity_label></dt><dd><span #humidity></span><small>%</small></dd></div>
          <div><dt #luminance_label></dt><dd><span #luminance></span><small>lux</small></dd></div>
        </dl>
      </section>

      <section class="observation lighting" #lighting data-lamp="unknown">
        <header><span class="section-index" aria-hidden="true">02 /</span><h2 #light_heading></h2></header>
        <div class="lamp-status">
          <span class="lamp-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4v7m-6 0h12l4 8H6Zm-6 13 2 3m4-3v4m6-4-2 3"/></svg>
          </span>
          <div><p class="source" #light_name></p><strong #light_state aria-live="polite"></strong></div>
        </div>
        <button class="light-toggle" type="button" #light_toggle (click)="toggleLight()" disabled>
          <span #light_action></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v8m4.8-5a7.5 7.5 0 1 1-9.6 0"/></svg>
        </button>
        <p class="feedback" #feedback role="status"></p>
      </section>

</section>
