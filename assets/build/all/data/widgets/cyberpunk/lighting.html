<section class="panel lighting hud-frame" @set="void 0">
  <header class="panel-heading">
    <span class="panel-code" aria-hidden="true">01</span>
    <div><h2 #title></h2><p #subtitle></p></div>
    <span class="material-symbols-outlined" aria-hidden="true">electrical_services</span>
  </header>
  <ul class="circuits">
    <li class="circuit" #light1>
      <span class="material-symbols-outlined circuit-icon" aria-hidden="true">lightbulb</span>
      <div class="circuit-description"><span data-part="name"></span><span class="circuit-state" data-part="state" role="status"></span></div>
      <button class="hud-button" type="button" (click)="toggleLight(0)" disabled aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 6.9a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </li>
    <li class="circuit" #light2>
      <span class="material-symbols-outlined circuit-icon" aria-hidden="true">lightbulb</span>
      <div class="circuit-description"><span data-part="name"></span><span class="circuit-state" data-part="state" role="status"></span></div>
      <button class="hud-button" type="button" (click)="toggleLight(1)" disabled aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 6.9a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </li>
    <li class="circuit" #light3>
      <span class="material-symbols-outlined circuit-icon" aria-hidden="true">lightbulb</span>
      <div class="circuit-description"><span data-part="name"></span><span class="circuit-state" data-part="state" role="status"></span></div>
      <button class="hud-button" type="button" (click)="toggleLight(2)" disabled aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 6.9a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </li>
  </ul>
</section>
