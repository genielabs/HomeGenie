<section class="district" @set="void 0">
  <header class="mast">
    <div class="brand"><span class="brand-mark" aria-hidden="true">N</span><span>NEON<br>DISTRICT</span></div>
    <span class="mast-label" #console_label></span>

  </header>

  <div class="district-layout">
    <div class="city-column">
      <section class="city-panel" #city_panel>
        <svg class="city" viewBox="0 0 840 470" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
          <defs>
            <linearGradient id="nd-sky" x2="0" y2="1" gradientUnits="objectBoundingBox">
              <stop class="sky-high" stop-color="#101328"/><stop class="sky-mid" offset=".66" stop-color="#351944"/><stop class="sky-low" offset="1" stop-color="#090c19"/>
            </linearGradient>
            <linearGradient id="nd-disc" x2="0" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#ffb27e"/><stop offset=".7" stop-color="#ef62a9"/><stop offset="1" stop-color="#a53395"/>
            </linearGradient>
            <linearGradient id="nd-glass" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#242842"/><stop offset="1" stop-color="#0a1021"/>
            </linearGradient>
            <linearGradient id="nd-road" x2="0" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#35304b"/><stop offset=".76" stop-color="#10202f"/><stop offset="1" stop-color="#090d18"/>
            </linearGradient>
            <pattern id="nd-windows" width="12" height="11" patternUnits="userSpaceOnUse">
              <path d="M2 2h5v2H2z" fill="#6feee8" opacity=".53"/><path d="M8 7h2v2H8z" fill="#ff83b7" opacity=".6"/>
            </pattern>
            <pattern id="nd-scan" width="1" height="7" patternUnits="userSpaceOnUse">
              <path d="M0 5h1v2H0z" fill="#101020" opacity=".55"/>
            </pattern>
          </defs>
          <path fill="url(#nd-sky)" d="M0 0h840v470H0z"/>
          <g fill="#c4c8fb" opacity=".46">
            <path d="M271 55h2v2h-2zM356 111h2v2h-2zM419 79h2v2h-2zM749 36h3v3h-3zM730 114h2v2h-2zM789 122h2v2h-2zM683 52h2v2h-2zM492 39h2v2h-2zM322 148h2v2h-2z"/>
          </g>
          <g class="sun">
            <circle cx="592" cy="184" r="107" fill="#f257b2" opacity=".22"/>
            <circle cx="592" cy="184" r="91" fill="url(#nd-disc)"/>
            <circle cx="592" cy="184" r="91" fill="url(#nd-scan)"/>
          </g>
          <g class="moon">
            <circle cx="592" cy="174" r="86" fill="#a2a6f5" opacity=".13"/>
            <path d="M617 106a70 70 0 1 0 47 96 65 65 0 0 1-47-96Z" fill="#ede5ff"/>
            <circle cx="615" cy="204" r="7" fill="#b0a8df" opacity=".38"/>
            <circle cx="577" cy="179" r="10" fill="#b0a8df" opacity=".28"/>
          </g>
          <path d="M0 293h840M0 312h840M0 331h840" stroke="#ed69bc" stroke-opacity=".24"/>
          <path fill="#251b3a" d="M0 266h28v-43h16v41h14v-9h11v-25h42v22h15v-64h20v37h19v-47h14v46h11v-33h42v-38h14v35h19v53h17v-17h16v-32h18v29h27v-51h14v58h35v-20h13v-45h14v60h29v-24h24v-32h13v34h32v-27h22v31h25v-50h20v65h15v-43h18v22h21v-48h19v51h11v-62h17v64h31v-42h21v34h28v-61h18v41h18v-48h17v30h16v111H0z"/>
          <g fill="url(#nd-glass)" stroke="#6f527b" stroke-opacity=".55">
            <path d="M26 348v-82h40v-22h28v104z"/>
            <path d="M99 348V211l30-12 36 11v138z"/>
            <path d="M166 348V168l31-20 43 15v185z"/>
            <path d="M250 348V234h21v-38l35-14 36 16v150z"/>
            <path d="M348 348v-86h54v-17h30v103z"/>
            <path d="M610 348V224l32-17 33 7v134z"/>
            <path d="M681 348V149l34-18 44 16v201z"/>
            <path d="M766 348v-89l25-15 30 9v95z"/>
          </g>
          <g class="building-lights" fill="url(#nd-windows)">
            <path d="M40 275h45v65H40zM111 222h43v112h-43zM177 175h52v150h-52zM263 245h65v91h-65zM283 201h45v37h-45zM358 272h55v57h-55zM620 231h45v102h-45zM694 159h50v173h-50zM776 264h35v68h-35z"/>
          </g>
          <g fill="none" stroke-width="2">
            <path stroke="#49d6e4" d="M165 169l31-21 43 15m-43-15V112m489 36 31-17 43 16m-43-17V99M271 196l35-14 36 16"/>
            <path stroke="#fb73b6" d="M99 211l30-12 36 11m445 14 32-17 33 7m91 45 25-15 30 9"/>
          </g>
          <path fill="#0a0f1e" d="M0 342h840v128H0z"/>
          <path fill="url(#nd-road)" d="m410 342 42 0 239 128H158z"/>
          <g fill="none" stroke-width="2">
            <path stroke="#4de6ee" stroke-opacity=".64" d="M410 342 158 470m294-128 239 128m-256-128 40 128"/>
            <path stroke="#f979c1" stroke-opacity=".55" d="M397 342 99 470m367-128 292 128"/>
          </g>
          <g transform="translate(410 342)" fill="none" stroke="#4de6ee" stroke-opacity=".32" stroke-width="2">
            <path class="road-line" d="M0 0h42"/>
            <path class="road-line" d="M0 0h42" style="--road-slot: 1"/>
            <path class="road-line" d="M0 0h42" style="--road-slot: 2"/>
            <path class="road-line" d="M0 0h42" style="--road-slot: 3"/>
            <path class="road-line" d="M0 0h42" style="--road-slot: 4"/>
            <path class="road-line" d="M0 0h42" style="--road-slot: 5"/>
          </g>
          <g class="weather-clouds" fill="#e6ccff">
            <path d="M389 178h139a17 17 0 0 0 0-34h-5a24 24 0 0 0-43-8 29 29 0 0 0-54 13h-37a15 15 0 0 0 0 29Z" opacity=".56"/>
            <path d="M657 243h143a13 13 0 0 0 0-26h-31a19 19 0 0 0-33-10 23 23 0 0 0-41 12h-38a12 12 0 0 0 0 24Z" opacity=".36"/>
          </g>
          <g class="weather-mist" fill="none" stroke="#ead4ff" stroke-linecap="round">
            <path d="M35 246h163m60 4h171m34-14h177m25 14h121M14 278h302m54 12h270m58-3h115" stroke-width="16" opacity=".2"/>
            <path d="M41 311h324m61 6h319" stroke-width="28" opacity=".13"/>
          </g>
          <g class="weather-rain" fill="none" stroke="#aff8ff" stroke-width="2" stroke-linecap="round">
            <path d="m118 102-15 24m89 38-15 24m87 29-15 24m89-56-15 24m69-102-15 24m93 7-15 24m66 94-15 24m85-101-15 24m89 56-15 24m88-126-15 24M87 302l-15 24m103 60-15 24m121-90-15 24m88 39-15 24m105-96-15 24m81 66-15 24m90-85-15 24m90 28-15 24m88-69-15 24"/>
          </g>
          <g class="weather-snow" fill="#e4fcff">
            <path d="M113 113h4v4h-4zM190 174h3v3h-3zM247 223h4v4h-4zM330 194h3v3h-3zM386 113h4v4h-4zM465 148h3v3h-3zM513 265h4v4h-4zM586 185h3v3h-3zM651 261h4v4h-4zM731 154h3v3h-3zM78 314h4v4h-4zM160 397h3v3h-3zM263 335h4v4h-4zM335 392h3v3h-3zM414 324h4v4h-4zM479 404h3v3h-3zM558 347h4v4h-4zM633 392h3v3h-3zM708 351h4v4h-4z"/>
          </g>
        </svg>

        <div class="city-content">
          <span class="overline"><span aria-hidden="true">◈</span> <span #scene_label></span></span>
          <div class="city-title"><h1 #headline></h1><p #subtitle></p></div>
          <div class="city-footer">
            <div class="time-block"><time #clock></time><span #date_label></span></div>
            <div class="light-chip"><span class="light-dot" aria-hidden="true"></span><span #light_summary></span></div>
          </div>
        </div>
      </section>

      <section class="district-message" #district_message hidden>
        <span class="overline" #district_message_label></span>
        <p #district_message_text></p>
      </section>

      <section class="weather-panel" #weather_panel hidden>
        <header class="weather-heading">
          <span class="overline" #weather_title></span>
          <span class="weather-updated" #weather_updated></span>
          <button class="motion weather-settings" type="button" #weather_settings (click)="openWeatherSettings()" hidden>
            <span class="material-symbols-outlined" aria-hidden="true">settings</span>
          </button>
        </header>
        <div class="weather-body">
          <div class="weather-now">
            <img #weather_icon alt="" aria-hidden="true" hidden>
            <div><span #weather_location></span><strong #weather_temperature></strong><span #weather_description></span></div>
          </div>
          <ul class="forecast" #weather_forecast hidden>
          <li #forecast1 hidden><span data-part="day"></span><img alt="" aria-hidden="true" hidden><strong data-part="temp"></strong><span data-part="description" class="sr-only"></span></li>
          <li #forecast2 hidden><span data-part="day"></span><img alt="" aria-hidden="true" hidden><strong data-part="temp"></strong><span data-part="description" class="sr-only"></span></li>
          <li #forecast3 hidden><span data-part="day"></span><img alt="" aria-hidden="true" hidden><strong data-part="temp"></strong><span data-part="description" class="sr-only"></span></li>
          </ul>
        </div>
        <div class="weather-details" #weather_details hidden></div>
      </section>
    </div>

    <aside class="modules">
      <cyberpunk-lighting></cyberpunk-lighting>
      <cyberpunk-telemetry></cyberpunk-telemetry>
    </aside>
  </div>

  <footer class="district-footer"><span>HG / 01</span><span #footer_hint></span></footer>
</section>
