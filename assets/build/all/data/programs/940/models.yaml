# Timings are observations on the development host, not performance guarantees.
# Requirements are guidance, not measured minimum RAM or compatibility guarantees.
# Memory includes model weights, context cache, native buffers and other applications.
# Sampling values below follow the official Qwen model cards for the selected mode.
# DefaultTemperature is emitted to the UI only when switching to a different model.
# Output/context remain user-selected: official 16K/32K+ output recommendations exceed HG's current 4096 limit.
# DefaultMaxTokens (64..4096) and DefaultContextSize (1024..32768, step 1024) are optional local choices.
# RepeatPenalty 1.0 disables HG's former extra 1.2 penalty; Qwen3 generation configs do not request that penalty.

