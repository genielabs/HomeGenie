<section class="ffmpeg-setup">
  <h2 #title></h2>
  <p #description></p>
  <p #status role="status" aria-live="polite"></p>
  <progress #progress max="100" aria-label="FFmpeg" hidden></progress>
  <p #details class="details" hidden></p>
  <code #command hidden></code>
  <button #action type="button" (click)="prepare()" hidden></button>
  <p #note class="details" hidden></p>
</section>
