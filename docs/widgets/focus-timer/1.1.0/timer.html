<section class="clock" #clock>
  <header><h1>Focus Timer</h1><span #count></span></header>
  <div class="modes" role="group"><button #focus>Focus</button><button #short>Short break</button><button #long>Long break</button></div>
  <div class="dial" #dial><output #time>25:00</output></div>
  <div class="actions"><button #start>Start</button><button #reset>Reset</button></div>
  <label #lamp_row hidden><input type="checkbox" #lamp><span #lamp_name></span></label>
  <div #notice role="status"></div>
</section>
