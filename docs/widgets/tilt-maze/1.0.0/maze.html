<section class="maze"><header><h1>Tilt Maze</h1><span #status role="status"></span></header>
<canvas #board width="600" height="420" aria-label="Maze"></canvas>
<div class="controls"><button #tilt>◎</button><button #left aria-label="Left">←</button><button #up aria-label="Up">↑</button><button #down aria-label="Down">↓</button><button #right aria-label="Right">→</button><button #reset aria-label="Restart">↻</button></div></section>
